name: WatchieTalkie
options:
  bundleIdPrefix: de.sgitaize
  deploymentTarget:
    watchOS: "10.0"
settings:
  base:
    DEVELOPMENT_TEAM: V7GQKCH73F
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WatchieTalkie:
    type: application
    platform: watchOS
    sources:
      - path: WatchieTalkie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.sgitaize.watchietalkie
        PRODUCT_NAME: WatchieTalkie
        INFOPLIST_FILE: WatchieTalkie/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: WatchieTalkie/NaCl/Bridging.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        GCC_WARN_INHIBIT_ALL_WARNINGS: NO
        SKIP_INSTALL: NO
